name: vrlizate_home
description: Themeable VRlizate entry, catalog and spatial lobby with host-owned experiences and services.
version: 1.0.0
homepage: https://github.com/Open-Neom/vrlizate_home
repository: https://github.com/Open-Neom/vrlizate_home
issue_tracker: https://github.com/Open-Neom/vrlizate_home/issues
environment:
  sdk: ^3.10.8
  flutter: '>=3.47.0'

dependencies:
  vrlizate_avatar: ^1.0.0
  flutter:
    sdk: flutter
  flutter_scene: ^0.24.3
  vrlizate: ^1.12.0
  vrlizate_scene: ^1.0.0
  vrlizate_widgets: ^1.0.0
  vrlizate_joystick: ^1.0.0
  vector_math: ^2.2.0
  vrlizate_world: ^1.0.0
  vrlizate_physics: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/showcase/
